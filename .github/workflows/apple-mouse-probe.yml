name: Apple mouse input experiment
on:
  workflow_dispatch:
  push:
    paths:
      - apple-mouse-probe/**
      - .github/workflows/apple-mouse-probe.yml
permissions:
  contents: read
jobs:
  wrapper-diagnostics:
    if: ${{ contains(github.event.head_commit.message, '[diagnostics]') }}
    runs-on: xcode-27
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 apple-mouse-probe/inspect-abi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrapper-diagnostics
          path: apple-mouse-probe/output/
          retention-days: 7
  safari-input:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostics]') }}
    runs-on: xcode-27
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - name: Test iPhone and iPad Simulator mouse input
        env:
          PROBE_DEVICE: ${{ matrix.device }}
        run: bash apple-mouse-probe/run.sh
      - name: Preserve actual logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-mouse-input-${{ matrix.device }}
          path: apple-mouse-probe/output/
          retention-days: 7
          if-no-files-found: error
