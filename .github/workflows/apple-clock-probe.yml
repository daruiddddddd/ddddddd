name: iPad published clock input experiment
on:
  workflow_dispatch:
  push:
    paths:
      - apple-clock-probe/**
      - .github/workflows/apple-clock-probe.yml
permissions:
  contents: read
jobs:
  ipad-clock:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated clock-only overlay
        run: |
          cp apple-clock-probe/clock-injector.m apple-mouse-probe/injector.m
          cp apple-clock-probe/clock-run.py apple-mouse-probe/product-run.py
          cp apple-clock-probe/clock-receiver.py apple-mouse-probe/product-receiver.py
      - name: Public CAD clock gestures on iPad Simulator
        env:
          PROBE_DEVICE: ipad
          PROBE_HEADLESS: '0'
          PROBE_MOUSE_ONLY: ''
          PROBE_RAW_MOUSE: '0'
          PROBE_FOCUS: product-html
          CLOCK_PUBLIC_URL: https://jw1036-rebuild-lab.ryu08ma.chatgpt.site/?v=0221
          CLOCK_PUBLIC_BYTES: '256855'
          CLOCK_PUBLIC_SHA256: 914af5bbb64c30b7dab6db7360762f596f674c438fd0abd334edd57774069d9b
        run: bash apple-mouse-probe/run.sh
      - name: Preserve observed state and actual input including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-clock-input-0221
          path: apple-mouse-probe/output/
          retention-days: 7
          if-no-files-found: error
