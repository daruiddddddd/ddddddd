name: iPad native touch without Web Inspector
on:
  workflow_dispatch:
  push:
    paths:
      - apple-native-touch/**
      - .github/workflows/apple-native-touch.yml
permissions:
  contents: read
jobs:
  touch:
    strategy:
      fail-fast: false
      matrix:
        device: [ipad]
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Appium and Apple XCTest driver
        run: |
          npm install --global appium@3.8.0
          appium driver install xcuitest@12.18.1
      - name: Touch public HTML in real Simulator Safari
        env:
          PROBE_DEVICE: ${{ matrix.device }}
        run: python3 apple-native-touch/run.py
      - name: Preserve results and screenshots including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-touch-${{ matrix.device }}-0241
          path: apple-native-touch/output/
          retention-days: 7
          if-no-files-found: error
